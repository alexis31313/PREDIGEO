# Configuración de íconos de PrediGeo.
# Ícono original: polígono de terreno (tierra) con punto GPS (verde).
# Generar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"
