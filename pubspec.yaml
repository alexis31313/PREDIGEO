name: predigeo
description: PrediGeo - A Flutter application for geographic prediction.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^14.2.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  google_maps_flutter: ^2.5.3
  share_plus: ^10.0.0
  csv: ^6.0.0
  intl: ^0.19.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  # Permite ejecutar las pruebas de la capa de datos sobre SQLite en el
  # escritorio (sin emulador Android ni conexión a internet).
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
